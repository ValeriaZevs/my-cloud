version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: mycloud_db
      POSTGRES_USER: mycloud_user
      POSTGRES_PASSWORD: mycloud_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycloud_user -d mycloud_db"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000" 
    environment:
      - USE_POSTGRES=True
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./frontend/dist:/app/frontend_build

  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules  
    command: sh -c "npm install && npm run build"

volumes:
  postgres_data: